        '200': { description: "Daftar promo" }
    post:
      operationId: adminCreatePromo
      tags: [Admin Katalog]
      summary: Tambah promo (percentage 1-100 / fixed)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, value]
              properties:
                code: { type: string, example: HEMAT5K }
                type: { type: string, enum: [percentage, fixed], example: fixed }
                value: { type: integer, example: 5000 }
                min_order: { type: integer, example: 20000 }
                max_discount: { type: integer, nullable: true, example: 10000 }
                valid_from: { type: string, format: date, example: '2026-01-01' }
                valid_until: { type: string, format: date, example: '2026-12-31' }
                is_active: { type: boolean, example: true }
      responses:
        '201': { description: "Promo dibuat" }
  /api/admin/promos/{id}:
    get:
      operationId: adminShowPromo
