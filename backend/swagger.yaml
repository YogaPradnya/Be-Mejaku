          schema: { type: integer, example: 1 }
      responses:
        '200': { description: "Detail promo" }
    put:
      operationId: adminUpdatePromo
      tags: [Admin Katalog]
      summary: Ubah promo
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
