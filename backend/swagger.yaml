          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Warung Bali Dwi }
      responses:
        '200': { description: "Diperbarui" }
    delete:
      operationId: adminDeleteMerchant
      tags: [Admin Katalog]
      summary: Hapus merchant (?force=1 bila masih punya menu)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
        - in: query
          name: force
