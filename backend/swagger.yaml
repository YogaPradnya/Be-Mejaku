      operationId: adminDeletePromo
      tags: [Admin Katalog]
      summary: Hapus promo permanen
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: "Dihapus" }
  /api/admin/menu:
    get:
      operationId: adminListMenu
      tags: [Admin Katalog]
      summary: Daftar menu (?search,is_available,merchant_id,per_page)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string, example: betutu }
        - in: query
          name: is_available
          schema: { type: boolean, example: true }
        - in: query
          name: per_page
          schema: { type: integer, example: 15 }
      responses:
        '200': { description: "Daftar menu + meta" }
    post:
      operationId: adminCreateMenu
      tags: [Admin Katalog]
      summary: Tambah menu (merchant otomatis = satu-satunya)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_price]
              properties:
                name: { type: string, example: Ayam Betutu }
                description:
                  type: string
                  example:  Ayam kampung bumbu betutu
                base_price: { type: integer, example: 25000 }
                stock: { type: integer, example: 50 }
                image: { type: string, format: uri, example: https://res.cloudinary.com/demo/image/upload/v1/menu.jpg }
                has_spice_option: { type: boolean, example: true }
                portions: { type: array, items: { type: object }, example: [{name: Reguler, surcharge: 0}] }
                addons: { type: array, items: { type: object }, example: [{name: Es Teh, price: 5000}] }
            example:
              name: Ayam Betutu
              base_price: 25000
              stock: 50
      responses:
        '201': { description: "Menu dibuat" }
  /api/admin/menu/upload-image:
    post:
      operationId: adminUploadMenuImage
      tags: [Admin Katalog]
      summary: Upload foto menu ke Cloudinary (multipart)
      description: Di Scalar pilih Body → form-data → field image (file). Response berisi url + public_id untuk dipakai di POST /api/admin/menu.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '200': { description: '{ success, data: { url, public_id } }' }
        '503':
          description: Cloudinary belum dikonfigurasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/admin/menu/{id}:
    get:
      operationId: adminShowMenu
      tags: [Admin Katalog]
      summary: Detail menu admin
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: "Detail menu" }
    put:
      operationId: adminUpdateMenu
      tags: [Admin Katalog]
      summary: Ubah menu (portions/addons dikirim = replace penuh)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Ayam Betutu }
                base_price: { type: integer, example: 25000 }
                stock: { type: integer, example: 50 }
                image:
                  type: string
                  nullable: true
                  example: https://res.cloudinary.com/demo/image/upload/v1/menu.jpg
                  description: Kirim null untuk hapus foto
      responses:
        '200': { description: "Diperbarui" }
    delete:
      operationId: adminDeleteMenu
      tags: [Admin Katalog]
      summary: Soft delete (is_available=false); ?force=1 permanen
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
        - in: query
          name: force
          schema: { type: boolean, example: true }
      responses:
        '200': { description: "Dinonaktifkan" }
  /api/admin/menu/{id}/toggle:
    patch:
      operationId: adminToggleMenu
      tags: [Admin Katalog]
      summary: Tampilkan/sembunyikan menu
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: "Status diubah" }
